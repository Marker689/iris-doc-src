get:
  operationId: api_v2_manage_case-objects_case-classifications_get
  tags:
    - Case objects
    - Beta
  summary: List case classifications
  description: Returns a paginated list of case classifications. Supports substring search on `name`, `name_expanded` and `description` via the `search` query parameter.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
    - name: search
      in: query
      required: false
      description: Case-insensitive substring match on `name`, `name_expanded` or `description`
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of case classifications
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    name_expanded:
                      type: string
                    description:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
post:
  operationId: api_v2_manage_case-objects_case-classifications_post
  tags:
    - Case objects
    - Beta
  summary: Create a case classification
  description: Create a new case classification.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            name_expanded:
              type: string
            description:
              type: string
          required:
            - name
            - name_expanded
        example:
          name: abusive-content:spam
          name_expanded: Abusive content - Spam
          description: Unsolicited bulk email
  responses:
    '201':
      description: Case classification successfully created
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              name_expanded:
                type: string
              description:
                type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

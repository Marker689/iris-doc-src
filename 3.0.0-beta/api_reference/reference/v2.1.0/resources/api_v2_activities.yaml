get:
  operationId: api_v2_activities_get
  tags:
    - Activities
    - Beta
  summary: List user activities
  description: >-
    Paginated, access-scoped listing of user activity rows. Callers only
    see rows they are authorised to read; the `all_activities_read`
    permission is required to include rows that are not attached to a
    case. Results are ordered by activity date, most recent first.
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 200
    - name: order_by
      in: query
      required: false
      schema:
        type: string
        description: Column to sort by
    - name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
    - name: search
      in: query
      required: false
      schema:
        type: string
        description: ILIKE filter on the activity description
    - name: user_id
      in: query
      required: false
      schema:
        type: integer
    - name: case_id
      in: query
      required: false
      schema:
        type: integer
    - name: since
      in: query
      required: false
      schema:
        type: string
        format: date-time
        description: Include only activities on or after this ISO-8601 timestamp (alias of `date_from`)
    - name: include_non_case
      in: query
      required: false
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: Paginated list of activities
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    user_id:
                      type: integer
                    user_name:
                      type: string
                    case_id:
                      type:
                        - integer
                        - 'null'
                    activity_desc:
                      type: string
                    activity_date:
                      type: string
                      format: date-time
                    is_from_api:
                      type: boolean
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

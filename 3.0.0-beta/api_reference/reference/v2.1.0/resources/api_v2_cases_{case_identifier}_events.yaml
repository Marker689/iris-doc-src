parameters:
  - $ref: ../parameters/path/case_identifier.yaml
post:
  operationId: api_v2_cases_(case_identifier)_events_post
  summary: Add a new event
  description: Create a new event in the timeline.
  tags:
    - Timeline
    - Beta
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            event_title:
              type: string
            event_category_id:
              type: integer
            event_date:
              type: string
            event_tz:
              type: string
            event_assets:
              type: array
              items:
                type: integer
            event_iocs:
              type: array
              items:
                type: integer
            event_raw:
              type: string
            event_source:
              type: string
            event_in_summary:
              type: boolean
            event_in_graph:
              type: boolean
            event_color:
              type: string
            event_sync_iocs_assets:
              type: boolean
            event_tags:
              type: string
            event_content:
              type: string
            custom_attributes:
              type: object
            parent_event_id:
              type: integer
          required:
            - event_title
            - event_category_id
            - event_date
            - event_tz
            - event_assets
            - event_iocs
        example:
          event_title: An event
          event_category_id: 5
          event_date: '2023-03-08T03:02:00.000'
          event_tz: '+00:00'
          event_assets:
            - 45
          event_iocs:
            - 33
          event_raw: My event raw data
          event_source: My source
          event_in_summary: true
          event_in_graph: true
          event_color: '#1572E899'
          event_sync_iocs_assets: true
          event_tags: tag
          event_content: My description
          parent_event_id: 11
          custom_attributes: {}
  responses:
    '201':
      description: Event successfully created
      content:
        application/json:
          schema:
            $ref: ../schemas/Event.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      description: Case with identifier `case_identifier` not found

get:
  operationId: api_v2_cases_(case_identifier)_events_get
  tags:
    - Timeline
    - Beta
  summary: List case events
  description: >-
    The case timeline, with the lookup tables the timeline view needs to render
    it — asset and IOC names, the category list, and the per-event comment
    counts — returned alongside the events rather than as separate calls.


    Every filter below is repeatable and filters are ANDed across dimensions,
    ORed within one. Omit them all to get the whole timeline.


    Pagination does not cut lineage: if a paginated slice contains an event that
    has a parent or children outside the slice, those relatives are grafted into
    the returned page, so a threaded event never renders as an orphan. The page
    can therefore hold more rows than `per_page`.
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    - name: per_page
      in: query
      required: false
      description: '0 returns the whole timeline. Values above 500 are clamped to 500.'
      schema:
        type: integer
        default: 0
        maximum: 500
    - name: asset
      in: query
      required: false
      description: Asset name. Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: asset_id
      in: query
      required: false
      description: Asset id. Repeatable. Non-integer values are ignored.
      schema:
        type: array
        items:
          type: integer
    - name: ioc
      in: query
      required: false
      description: IOC value. Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: ioc_id
      in: query
      required: false
      description: IOC id. Repeatable. Non-integer values are ignored.
      schema:
        type: array
        items:
          type: integer
    - name: event_id
      in: query
      required: false
      description: Restrict to specific events. Repeatable.
      schema:
        type: array
        items:
          type: integer
    - name: title
      in: query
      required: false
      description: Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: source
      in: query
      required: false
      description: Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: description
      in: query
      required: false
      description: Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: raw
      in: query
      required: false
      description: Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: category
      in: query
      required: false
      description: Category name. Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: tag
      in: query
      required: false
      description: Repeatable.
      schema:
        type: array
        items:
          type: string
    - name: start_date
      in: query
      required: false
      description: An unparseable date drops the bound rather than erroring.
      schema:
        type: string
    - name: end_date
      in: query
      required: false
      description: An unparseable date drops the bound rather than erroring.
      schema:
        type: string
    - name: flag
      in: query
      required: false
      description: >-
        Compared case-insensitively against `true`; anything else means false.
      schema:
        type: boolean
  responses:
    '200':
      description: Case timeline successfully listed
      content:
        application/json:
          schema:
            type: object
            properties:
              tim:
                description: The events on this page, plus any grafted relatives.
                type: array
                items:
                  type: object
              comments_map:
                description: >-
                  Comment counts keyed by event id. Events with no comments are
                  absent rather than zero.
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: integer
              assets:
                description: >-
                  Asset lookup keyed by asset id, each entry `[name, type]`.
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
              iocs:
                description: IOCs referenced by the events on this page.
                type: array
                items:
                  type: object
              categories:
                description: Every event category defined on the instance, by name.
                type: array
                items:
                  type: string
              state:
                description: >-
                  Timeline state marker, used to detect that the timeline changed
                  since it was last fetched.
                type: object
              pagination:
                type: object
                properties:
                  total:
                    type: integer
                  per_page:
                    description: Echoes `total` when the whole timeline was returned.
                    type: integer
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  next_page:
                    type:
                      - integer
                      - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

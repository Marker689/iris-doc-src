parameters:
  - name: case_identifier
    in: path
    required: true
    description: Identifier of the case
    schema:
      type: integer
  - name: identifier
    in: path
    required: true
    description: Identifier of the IoC within the case
    schema:
      type: integer
get:
  operationId: api_v2_cases_(case_identifier)_iocs_(identifier)_links_get
  tags:
    - IOCs
    - Beta
  summary: List other cases that share this IoC
  description: Returns the list of OTHER cases where the same IoC value and type was seen. Results are gated by the current user's per-case access so hits only appear for cases the user can already read.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
  responses:
    '200':
      description: Other cases where the IoC appears
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                case_id:
                  type: integer
                case_name:
                  type: string
                ioc_id:
                  type: integer
                ioc_value:
                  type: string
                ioc_type_id:
                  type: integer
                ioc_description:
                  type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

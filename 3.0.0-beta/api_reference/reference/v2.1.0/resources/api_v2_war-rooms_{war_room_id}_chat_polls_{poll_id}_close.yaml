parameters:
  - name: war_room_id
    in: path
    required: true
    schema:
      type: integer
  - name: poll_id
    in: path
    required: true
    schema:
      type: integer
post:
  operationId: api_v2_war-rooms_(war_room_id)_chat_polls_(poll_id)_close_post
  tags:
    - War room chat
    - Beta
  summary: Close a poll
  description: >-
    Close the poll so no further votes are accepted. Only the poll
    author or a server administrator may close a poll. Broadcasts
    `poll:closed` and returns the final poll state.
  responses:
    '200':
      description: Poll successfully closed; final poll state returned
      content:
        application/json:
          schema:
            type: object
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

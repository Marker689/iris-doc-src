parameters:
  - name: war_room_id
    in: path
    required: true
    description: Identifier of the war room
    schema:
      type: integer
get:
  operationId: api_v2_war-rooms_(war_room_id)_notes-folders_get
  tags:
    - War room notes
    - Beta
  summary: List note folders
  description: Return the flat list of note folders belonging to the war room. The frontend hydrates the tree client-side from each folder's `parent_id` — same pattern as the case-side `/notes-directories` endpoint.
  responses:
    '200':
      description: Folders successfully returned
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                war_room_id:
                  type: integer
                parent_id:
                  type:
                    - integer
                    - 'null'
                created_at:
                  type: string
                updated_at:
                  type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
post:
  operationId: api_v2_war-rooms_(war_room_id)_notes-folders_post
  tags:
    - War room notes
    - Beta
  summary: Create a note folder
  description: Create a new note folder. `parent_folder_id` is optional; omit it or send `null` to place the folder at the root of the tree. Folder names are trimmed and capped at 512 characters server-side.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Human-readable folder name.
            parent_folder_id:
              type:
                - integer
                - 'null'
              description: Optional parent folder id. Send `null` (or omit) to create the folder at the root.
        example:
          name: Playbooks
          parent_folder_id: null
  responses:
    '201':
      description: Folder successfully created
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              war_room_id:
                type: integer
              parent_id:
                type:
                  - integer
                  - 'null'
              created_at:
                type: string
              updated_at:
                type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

get:
  operationId: api_v2_manage_event-categories_get
  tags:
    - Taxonomies
    - Beta
  summary: List event categories
  description: Returns a paginated list of event categories used on the case timeline. Read-only seed data. Supports substring search on `name` via the `search` query parameter.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
    - name: search
      in: query
      required: false
      description: Case-insensitive substring match on `name`
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of event categories
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

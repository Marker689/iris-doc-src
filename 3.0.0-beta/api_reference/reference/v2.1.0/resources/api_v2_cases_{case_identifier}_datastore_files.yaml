parameters:
  - name: case_identifier
    in: path
    required: true
    description: Identifier of the case
    schema:
      type: integer
get:
  operationId: api_v2_cases_(case_identifier)_datastore_files_get
  tags:
    - Case Datastore
    - Beta
  summary: List datastore files
  description: Returns a paginated flat list of every file stored in the case datastore. Use `folder_id` to restrict to a single folder and `q` to search on file name.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
    - name: folder_id
      in: query
      required: false
      description: Restrict the listing to files in this folder
      schema:
        type: integer
    - name: q
      in: query
      required: false
      description: Case-insensitive substring match on the original file name
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of datastore files
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    file_id:
                      type: integer
                    file_original_name:
                      type: string
                    file_description:
                      type: string
                    file_size:
                      type: integer
                    file_sha256:
                      type: string
                    file_parent_id:
                      type: integer
                    file_is_ioc:
                      type: boolean
                    file_is_evidence:
                      type: boolean
                    file_tags:
                      type: string
                    file_date_added:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

parameters:
  - name: identifier
    in: path
    required: true
    schema:
      type: integer
get:
  operationId: api_v2_manage_banners_(identifier)_get
  tags:
    - Banners
    - Beta
  summary: Get a banner
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../schemas/Banner.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
put:
  operationId: api_v2_manage_banners_(identifier)_put
  tags:
    - Banners
    - Beta
  summary: Update a banner
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/BannerRequest.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../schemas/Banner.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
delete:
  operationId: api_v2_manage_banners_(identifier)_delete
  tags:
    - Banners
    - Beta
  summary: Delete a banner
  responses:
    '204':
      $ref: ../responses/Deleted.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

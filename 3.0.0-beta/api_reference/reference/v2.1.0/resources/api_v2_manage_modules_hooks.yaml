get:
  operationId: api_v2_manage_modules_hooks_get
  tags:
    - Modules
    - Beta
  summary: List module hooks
  description: Return every hook declared by an installed module together with the object type / event on which it is registered. Used by the modules admin page to show a global hook map.
  parameters:
    - in: query
      name: page
      required: false
      description: 1-indexed page number
      schema:
        type: integer
        default: 1
    - in: query
      name: per_page
      required: false
      description: Page size
      schema:
        type: integer
        default: 25
  responses:
    '200':
      description: Hooks successfully returned
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              data:
                type: array
                items:
                  type: object
                  properties:
                    module_id:
                      type: integer
                    module_name:
                      type: string
                    hook_name:
                      type: string
                    hook_type:
                      type: string
                    hook_description:
                      type: string
              last_page:
                type: integer
              current_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

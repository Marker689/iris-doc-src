get:
  operationId: api_v2_manage_managed-assets_get
  tags:
    - Managed assets
    - Beta
  summary: List registry assets visible to the caller
  description: 'Assets are deduplicated per customer on a normalized name, so

    `SRV-DC01` and `srv-dc01` are one entry here even though they remain

    two separate rows inside their individual cases.'
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number, 1-based
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Rows per page (clamped server-side)
    - name: order_by
      in: query
      required: false
      schema:
        type: string
      description: 'One of: created_at, criticality, domain, environment, ip, is_active, location, managed_asset_id,
        name, owner, source, updated_at'
    - name: sort_dir
      in: query
      required: false
      schema:
        type: string
      description: asc or desc
    - name: client_id
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
      description: Restrict to these customers
      style: form
      explode: true
    - name: asset_type_id
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
      description: Restrict to these asset types
      style: form
      explode: true
    - name: criticality
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Restrict to these criticalities
      style: form
      explode: true
    - name: environment
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Restrict to these environments
      style: form
      explode: true
    - name: tag
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: Substring match on the tags field, one filter per tag
      style: form
      explode: true
    - name: owner
      in: query
      required: false
      schema:
        type: string
      description: Substring match on the owner field
    - name: search
      in: query
      required: false
      schema:
        type: string
      description: Substring match on name, ip, domain and description
    - name: is_active
      in: query
      required: false
      schema:
        type: boolean
      description: Only active or only retired assets
    - name: has_sightings
      in: query
      required: false
      schema:
        type: boolean
      description: Only assets with (or without) visible sightings
    - name: compromised
      in: query
      required: false
      schema:
        type: boolean
      description: Only assets seen compromised in a visible sighting
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              data:
                type: array
                items:
                  $ref: ../schemas/ManagedAssetDetail.yaml
              last_page:
                type: integer
              current_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
post:
  operationId: api_v2_manage_managed-assets_post
  tags:
    - Managed assets
    - Beta
  summary: Create a registry asset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../schemas/ManagedAssetDetailRequest.yaml
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../schemas/ManagedAssetDetail.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

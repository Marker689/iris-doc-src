parameters:
  - name: case_identifier
    in: path
    required: true
    description: Identifier of the case
    schema:
      type: integer
  - name: identifier
    in: path
    required: true
    description: Identifier of the datastore folder to rename
    schema:
      type: integer
post:
  operationId: api_v2_cases_(case_identifier)_datastore_folders_(identifier)_rename_post
  tags:
    - Case Datastore
    - Beta
  summary: Rename a datastore folder
  description: Rename a datastore folder in place. Requires full access to the case.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            folder_name:
              type: string
          required:
            - folder_name
        example:
          folder_name: Renamed folder
  responses:
    '200':
      description: Folder renamed
      content:
        application/json:
          schema:
            type: object
            properties:
              path_id:
                type: integer
              path_name:
                type: string
              path_parent_id:
                type: integer
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

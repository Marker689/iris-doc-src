parameters:
  - name: war_room_id
    in: path
    required: true
    schema:
      type: integer
  - name: topic_id
    in: path
    required: true
    schema:
      type: integer
post:
  operationId: api_v2_war-rooms_(war_room_id)_chat_topics_(topic_id)_unarchive_post
  tags:
    - War room chat
    - Beta
  summary: Unarchive a chat topic
  description: >-
    Clear `archived_at`, putting the topic back in the live list. Idempotent —
    a live topic, Main included, is returned unchanged. Takes no body. Requires
    write access to the war room.
  responses:
    '200':
      description: Topic successfully unarchived
      content:
        application/json:
          schema:
            $ref: ../schemas/WarRoomChatTopic.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

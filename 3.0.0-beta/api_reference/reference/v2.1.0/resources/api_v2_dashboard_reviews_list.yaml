get:
  operationId: api_v2_dashboard_reviews_list_get
  tags:
    - Dashboard
    - Beta
  summary: List reviews owned by the current user
  description: Returns the cases for which the current user is the review owner. Used by the dashboard "my reviews" tile.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based) for pagination.
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        default: 25
  responses:
    '200':
      description: List of reviews owned by the current user
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                case_id:
                  type: integer
                case_name:
                  type: string
                status_id:
                  type: integer
                review_status:
                  type: object
                  properties:
                    status_name:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

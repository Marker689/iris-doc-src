get:
  operationId: api_v2_alert-clusters_get
  tags:
    - Alert clusters
    - Beta
  summary: List alert clusters
  description: >-
    Returns a paginated list of alert clusters visible to the caller. Supports
    filtering by customer, status and title.


    Visibility is scoped to the caller's own clusters; a server administrator
    sees every cluster instead.
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        default: 10
    - name: customer_id
      in: query
      required: false
      schema:
        type: integer
    - name: status_id
      in: query
      required: false
      schema:
        type: integer
    - name: title
      in: query
      required: false
      schema:
        type: string
    - name: sort
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of alert clusters
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                description: Number of the next page, `null` on the last one.
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  $ref: ../schemas/AlertCluster.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
post:
  operationId: api_v2_alert-clusters_post
  tags:
    - Alert clusters
    - Beta
  summary: Create an alert cluster
  description: |
    Create a new alert cluster. Optionally attach existing alerts to the newly
    created cluster by passing `alert_ids`. Unknown fields are dropped rather
    than rejected.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - cluster_title
            - cluster_status_id
            - cluster_customer_id
          properties:
            cluster_title:
              type: string
              description: Short human-readable title
            cluster_description:
              type: string
              description: Longer description of the cluster
            cluster_customer_id:
              type: integer
              description: Owning customer identifier. The caller must have access to that customer.
            cluster_status_id:
              type: integer
              description: Cluster status identifier
            cluster_severity_id:
              type: integer
              description: Cluster severity identifier
            cluster_owner_id:
              type: integer
              description: Analyst the cluster is assigned to
            alert_ids:
              type: array
              description: Optional list of alert identifiers to attach on creation
              items:
                type: integer
  responses:
    '201':
      description: Alert cluster successfully created
      content:
        application/json:
          schema:
            $ref: ../schemas/AlertCluster.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

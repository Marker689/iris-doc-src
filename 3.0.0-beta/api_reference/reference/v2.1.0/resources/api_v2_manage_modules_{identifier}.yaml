parameters:
  - $ref: ../parameters/path/identifier.yaml
get:
  operationId: api_v2_manage_modules_(identifier)_get
  tags:
    - Modules
    - Beta
  summary: Get a module
  description: Return the module's detailed metadata, including its declared hooks and parameters.
  responses:
    '200':
      description: Module successfully returned
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
              module_name:
                type: string
              module_version:
                type: string
              module_description:
                type: string
              is_active:
                type: boolean
              hooks:
                type: array
                items:
                  type: object
              parameters:
                type: array
                items:
                  type: object
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
delete:
  operationId: api_v2_manage_modules_(identifier)_delete
  tags:
    - Modules
    - Beta
  summary: Delete a module
  description: Unregister a module from IRIS. Fails when the module still has hooks bound to running case activity.
  responses:
    '204':
      $ref: ../responses/Deleted.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

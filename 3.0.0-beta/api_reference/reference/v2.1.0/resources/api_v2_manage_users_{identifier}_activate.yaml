parameters:
  - $ref: ../parameters/path/identifier.yaml
post:
  operationId: api_v2_manage_users_(identifier)_activate_post
  tags:
    - Manage Users
    - Beta
  summary: Activate a user
  description: Mark the user account as active so it can authenticate again. The request body is ignored.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
  responses:
    '200':
      description: User successfully activated
      content:
        application/json:
          schema:
            $ref: ../schemas/User.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

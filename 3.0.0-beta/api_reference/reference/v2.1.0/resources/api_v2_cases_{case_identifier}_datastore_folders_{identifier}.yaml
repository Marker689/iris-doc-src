parameters:
  - name: case_identifier
    in: path
    required: true
    description: Identifier of the case
    schema:
      type: integer
  - name: identifier
    in: path
    required: true
    description: Identifier of the datastore folder
    schema:
      type: integer
get:
  operationId: api_v2_cases_(case_identifier)_datastore_folders_(identifier)_get
  tags:
    - Case Datastore
    - Beta
  summary: Get a datastore folder
  description: Returns the metadata of a single datastore folder.
  responses:
    '200':
      description: Folder metadata
      content:
        application/json:
          schema:
            type: object
            properties:
              path_id:
                type: integer
              path_name:
                type: string
              path_parent_id:
                type: integer
              path_case_id:
                type: integer
              path_is_root:
                type: boolean
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
delete:
  operationId: api_v2_cases_(case_identifier)_datastore_folders_(identifier)_delete
  tags:
    - Case Datastore
    - Beta
  summary: Delete a datastore folder
  description: Delete a datastore folder and its contents. The root folder of a case datastore cannot be deleted. Requires full access to the case.
  responses:
    '204':
      $ref: ../responses/Deleted.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

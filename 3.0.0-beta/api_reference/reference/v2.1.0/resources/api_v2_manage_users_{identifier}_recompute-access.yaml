parameters:
  - $ref: ../parameters/path/identifier.yaml
post:
  operationId: api_v2_manage_users_(identifier)_recompute-access_post
  tags:
    - Manage Users
    - Beta
  summary: Recompute a user's effective access
  description: Force-recompute the user's effective case access cache. Useful after a manual database change or to debug effective-access drift. The request body is ignored.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
  responses:
    '200':
      description: Effective access successfully recomputed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              job_id:
                type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

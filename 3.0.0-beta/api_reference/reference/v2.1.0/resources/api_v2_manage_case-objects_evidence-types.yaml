get:
  operationId: api_v2_manage_case-objects_evidence-types_get
  tags:
    - Case objects
    - Beta
  summary: List evidence types
  description: Returns a paginated list of evidence types. Supports substring search on `name` and `description` via the `search` query parameter.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
    - name: search
      in: query
      required: false
      description: Case-insensitive substring match on `name` or `description`
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of evidence types
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
post:
  operationId: api_v2_manage_case-objects_evidence-types_post
  tags:
    - Case objects
    - Beta
  summary: Create an evidence type
  description: Create a new evidence type.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
          required:
            - name
        example:
          name: Disk image
          description: Raw or forensic-format disk image
  responses:
    '201':
      description: Evidence type successfully created
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              description:
                type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

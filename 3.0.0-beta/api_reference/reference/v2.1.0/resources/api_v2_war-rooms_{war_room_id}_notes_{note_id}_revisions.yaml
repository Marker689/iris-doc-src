parameters:
  - name: war_room_id
    in: path
    required: true
    description: Identifier of the war room
    schema:
      type: integer
  - name: note_id
    in: path
    required: true
    description: Identifier of the note
    schema:
      type: integer
get:
  operationId: api_v2_war-rooms_(war_room_id)_notes_(note_id)_revisions_get
  tags:
    - War room notes
    - Beta
  summary: List note revisions
  description: Return the revision history of a war-room note. Each row summarises when the revision was captured and by whom. Use the sibling `/revisions/{revision_number}` endpoint to fetch a specific revision's body.
  responses:
    '200':
      description: Revisions successfully returned
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                revision_number:
                  type: integer
                revised_at:
                  type: string
                user_name:
                  type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

parameters:
  - name: war_room_id
    in: path
    required: true
    description: Identifier of the war room
    schema:
      type: integer
  - name: note_id
    in: path
    required: true
    description: Identifier of the note
    schema:
      type: integer
get:
  operationId: api_v2_war-rooms_(war_room_id)_notes_(note_id)_get
  tags:
    - War room notes
    - Beta
  summary: Get a war-room note
  description: Return a single war-room note by id.
  responses:
    '200':
      description: Note successfully returned
      content:
        application/json:
          schema:
            type: object
            properties:
              note_id:
                type: integer
              war_room_id:
                type: integer
              folder_id:
                type: integer
              title:
                type: string
              content:
                type: string
              created_at:
                type: string
              updated_at:
                type: string
              created_by_id:
                type: integer
              updated_by_id:
                type: integer
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
patch:
  operationId: api_v2_war-rooms_(war_room_id)_notes_(note_id)_patch
  tags:
    - War room notes
    - Beta
  summary: Update a war-room note
  description: Partial update of a war-room note. Only the fields present in the body are touched. `folder_id` is treated specially — setting it to `null` moves the note to the root of the folder tree, while omitting the key leaves the folder unchanged. A revision snapshot is taken on every successful update.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
            content:
              type: string
            folder_id:
              type:
                - integer
                - 'null'
              description: Send `null` to move the note to the root; omit the key to leave the folder unchanged.
        example:
          title: Containment plan (v2)
          content: |-
            Updated body
          folder_id: null
  responses:
    '200':
      description: Note successfully updated
      content:
        application/json:
          schema:
            type: object
            properties:
              note_id:
                type: integer
              war_room_id:
                type: integer
              folder_id:
                type: integer
              title:
                type: string
              content:
                type: string
              created_at:
                type: string
              updated_at:
                type: string
              created_by_id:
                type: integer
              updated_by_id:
                type: integer
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
delete:
  operationId: api_v2_war-rooms_(war_room_id)_notes_(note_id)_delete
  tags:
    - War room notes
    - Beta
  summary: Delete a war-room note
  description: Delete a war-room note. Revision history is cascaded.
  responses:
    '204':
      $ref: ../responses/Deleted.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

get:
  operationId: api_v2_manage_alert-resolutions_get
  tags:
    - Taxonomies
    - Beta
  summary: List alert resolutions
  description: Returns a paginated list of alert resolution statuses (True Positive / False Positive / etc.). Read-only seed data. Supports substring search on `resolution_status_name` and `resolution_status_description` via the `search` query parameter.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 25
    - name: search
      in: query
      required: false
      description: Case-insensitive substring match on `resolution_status_name` or `resolution_status_description`
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of alert resolutions
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    resolution_status_id:
                      type: integer
                    resolution_status_name:
                      type: string
                    resolution_status_description:
                      type: string
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

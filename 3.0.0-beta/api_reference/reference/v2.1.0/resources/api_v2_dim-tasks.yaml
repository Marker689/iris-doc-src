get:
  operationId: api_v2_dim-tasks_get
  tags:
    - Dim tasks
    - Beta
  summary: List background dim tasks
  description: Paginated listing of Celery (Dim) background tasks. Accepts search and status filters.
  parameters:
    - name: page
      in: query
      required: false
      description: Page number (1-based) for pagination.
      schema:
        type: integer
        default: 1
    - name: per_page
      in: query
      required: false
      description: Number of items per page. Clamped between 1 and 200.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 200
    - name: status
      in: query
      required: false
      description: Exact-match filter on the Celery status column.
      schema:
        type: string
        enum:
          - SUCCESS
          - FAILURE
          - PENDING
          - STARTED
          - RETRY
    - name: user_id
      in: query
      required: false
      description: Restrict the result to tasks queued by the given user.
      schema:
        type: integer
    - name: search
      in: query
      required: false
      description: Case-insensitive substring filter matching the task name or task id.
      schema:
        type: string
  responses:
    '200':
      description: Paginated list of dim tasks
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              data:
                type: array
                items:
                  type: object
              last_page:
                type: integer
              current_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

get:
  operationId: api_v2_tags_get
  tags:
    - Tags
    - Beta
  summary: List tags
  description: >-
    List the tag catalog, optionally filtered by title and namespace. Any
    authenticated user can read the catalog.
  parameters:
    - schema:
        type: string
      name: tag_title
      in: query
      required: false
      description: Filter on the tag title. `term` is accepted as an alias when `tag_title` is absent.
    - schema:
        type: string
      name: term
      in: query
      required: false
      description: Alias for `tag_title`, used by the tag autocomplete widget. Ignored when `tag_title` is set.
    - schema:
        type: string
      name: tag_namespace
      in: query
      required: false
      description: Filter on the tag namespace
    - schema:
        type: integer
        default: 1
      name: page
      in: query
      required: false
      description: Page number (1-based)
    - schema:
        type: integer
        default: 10
      name: per_page
      in: query
      required: false
      description: Page size
    - schema:
        type: string
      name: order_by
      in: query
      required: false
      description: Column to sort on
    - schema:
        type: string
        default: asc
        enum:
          - asc
          - desc
      name: sort_dir
      in: query
      required: false
      description: Sort direction
    - schema:
        type: string
      name: fields
      in: query
      required: false
      description: >-
        Comma-separated list of fields to project. When set, rows carry only
        these keys.
      examples:
        titles-only:
          value: id,tag_title
  responses:
    '200':
      description: Tags successfully listed
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              current_page:
                type: integer
              last_page:
                type: integer
              next_page:
                description: Number of the next page, `null` on the last one.
                type:
                  - integer
                  - 'null'
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    tag_title:
                      type:
                        - string
                        - 'null'
                    tag_namespace:
                      type:
                        - string
                        - 'null'
                    tag_creation_date:
                      type:
                        - string
                        - 'null'
                      format: date-time
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

get:
  operationId: api_v2_manage_managed-assets_audit_get
  tags:
    - Managed assets
    - Beta
  summary: List the change history of the whole visible registry
  description: 'Deletions are only visible here: an entry''s asset id is nulled when

    the asset goes, so the per-asset endpoint has nothing left to look

    up. Entries carry the asset name and the acting login as snapshots

    so they stay readable after both are gone.'
  parameters:
    - name: client_id
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer
      description: Restrict to these customers
      style: form
      explode: true
    - name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number, 1-based
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Rows per page (clamped server-side)
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              data:
                type: array
                items:
                  $ref: ../schemas/ManagedAssetAudit.yaml
              last_page:
                type: integer
              current_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

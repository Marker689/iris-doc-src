parameters:
  - name: war_room_id
    in: path
    required: true
    schema:
      type: integer
  - name: poll_id
    in: path
    required: true
    schema:
      type: integer
get:
  operationId: api_v2_war-rooms_(war_room_id)_chat_polls_(poll_id)_get
  tags:
    - War room chat
    - Beta
  summary: Get a poll
  description: >-
    Return the current state of a chat poll: question, options, per-option
    vote counts, closed / open status, and the viewer's own votes
    (`my_votes`). Vote counts are computed live at read time.
  responses:
    '200':
      description: Poll successfully returned
      content:
        application/json:
          schema:
            type: object
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

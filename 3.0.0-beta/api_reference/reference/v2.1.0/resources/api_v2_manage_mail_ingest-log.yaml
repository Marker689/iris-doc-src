get:
  operationId: api_v2_manage_mail_ingest-log_get
  tags:
    - Mail rules
    - Beta
  summary: List recent mail ingest events
  description: >-
    Return the most recent rows from the mail ingest log. Read-only audit
    output showing every message the poller has seen, which rule (if any)
    matched, and whether the resulting action succeeded. Ordered
    newest-first. Server-administrator only.
  parameters:
    - schema:
        type: integer
        default: 1
      name: page
      in: query
      required: false
      description: Page number (1-based)
    - schema:
        type: integer
        default: 100
      name: per_page
      in: query
      required: false
      description: Page size (server clamps at 500)
    - schema:
        type: string
        format: date-time
      name: since
      in: query
      required: false
      description: ISO 8601 timestamp; only ingest events received after this point are returned
    - schema:
        type: string
      name: status
      in: query
      required: false
      description: Filter by outcome status (e.g. `matched`, `no_match`, `error`)
  responses:
    '200':
      description: Ingest log successfully listed
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    message_id:
                      type: string
                    received_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                    outcome:
                      type: string
                    outcome_object_id:
                      type:
                        - integer
                        - 'null'
                    rule_id:
                      type:
                        - integer
                        - 'null'
                    from_addr:
                      type:
                        - string
                        - 'null'
                    subject:
                      type:
                        - string
                        - 'null'
                    error:
                      type:
                        - string
                        - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml

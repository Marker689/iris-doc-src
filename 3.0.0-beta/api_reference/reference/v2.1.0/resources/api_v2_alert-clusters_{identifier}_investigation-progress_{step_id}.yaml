parameters:
  - name: identifier
    in: path
    required: true
    schema:
      type: integer
  - name: step_id
    in: path
    required: true
    schema:
      type: integer
post:
  operationId: api_v2_alert-clusters_(identifier)_investigation-progress_(step_id)_post
  tags:
    - Alert clusters
    - Beta
  summary: Record an investigation step as completed
  description: Mark an investigation-flow step as completed for this cluster, optionally attaching a note.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            note:
              type: string
              description: Optional note captured alongside the completion
  responses:
    '200':
      description: Step successfully recorded
      content:
        application/json:
          schema:
            type: object
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml
delete:
  operationId: api_v2_alert-clusters_(identifier)_investigation-progress_(step_id)_delete
  tags:
    - Alert clusters
    - Beta
  summary: Uncheck an investigation step
  description: Remove the completion record for an investigation-flow step on this cluster.
  responses:
    '204':
      $ref: ../responses/Deleted.yaml
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

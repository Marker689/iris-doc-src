parameters:
  - name: war_room_id
    in: path
    required: true
    description: Identifier of the war room
    schema:
      type: integer
  - name: task_id
    in: path
    required: true
    description: Identifier of the task
    schema:
      type: integer
post:
  operationId: api_v2_war-rooms_(war_room_id)_tasks_(task_id)_close_post
  tags:
    - War room tasks
    - Beta
  summary: Close a war-room task
  description: Mark a war-room task as closed. Records `closed_at` and `closed_by_id` server-side and emits a `task_completed` system event into the war-room chat stream.
  responses:
    '200':
      description: Task successfully closed
      content:
        application/json:
          schema:
            type: object
            properties:
              task_id:
                type: integer
              war_room_id:
                type: integer
              title:
                type: string
              status_id:
                type: integer
              closed_at:
                type: string
              closed_by_id:
                type: integer
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

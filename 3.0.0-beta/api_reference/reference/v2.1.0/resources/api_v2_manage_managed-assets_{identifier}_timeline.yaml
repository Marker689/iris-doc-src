parameters:
  - name: identifier
    in: path
    required: true
    schema:
      type: integer
get:
  operationId: api_v2_manage_managed-assets_(identifier)_timeline_get
  tags:
    - Managed assets
    - Beta
  summary: List case timeline events referencing a registry asset
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number, 1-based
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
      description: Rows per page (clamped to 200)
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              data:
                type: array
                items:
                  $ref: ../schemas/ManagedAssetTimeline.yaml
              last_page:
                type: integer
              current_page:
                type: integer
              next_page:
                type:
                  - integer
                  - 'null'
    '400':
      $ref: ../responses/GenericError.yaml
    '403':
      $ref: ../responses/Forbidden.yaml
    '404':
      $ref: ../responses/NotFound.yaml

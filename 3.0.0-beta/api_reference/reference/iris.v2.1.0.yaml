security:
  - Bearer <bearer>: []
tags:
  - name: Cases
    description: Endpoints to interact with cases
  - name: Notes
    description: Endpoints to interact with notes
  - name: Assets
    description: Endpoints to interact with assets
  - name: IOCs
    description: Endpoints to interact with IoCs
  - name: Timeline
    description: Endpoints to interact with events
  - name: Tasks
    description: Endpoints to interact with tasks
  - name: Evidences
    description: Endpoints to interact with evidences
  - name: Global tasks
    description: Endpoints to interact with global tasks
  - name: Alerts
    description: Endpoints to interact with alerts
  - name: Customers
    description: Endpoints to interact with customers
  - name: Comments
    description: Endpoints to interact with comments
  - name: Manage Users
    description: Endpoints to interact with users
  - name: Manage Groups
    description: Endpoints to interact with groups
  - name: Modules
    description: Endpoints to interact with modules
  - name: API
    description: General API endpoints
  - name: Authentication
    description: Session, MFA and OIDC authentication endpoints
  - name: Activities
    description: Global and case-scoped user activity feeds
  - name: Alert clusters
    description: Grouping of related alerts, including graph, comments and investigation progress
  - name: Cluster rules
    description: Rules that group incoming alerts into clusters
  - name: Cases filters
    description: Saved filters over the cases index
  - name: Custom dashboards
    description: User-defined dashboards and their widgets
  - name: Dashboard
    description: Landing-page dashboard endpoints (own cases, tasks, activities, KPIs)
  - name: Dim tasks
    description: Long-running background tasks queued by IRIS
  - name: Investigation flows
    description: Investigation playbooks that can be deployed to alerts and cases
  - name: Case Timelines
    description: Timelines and events within a case
  - name: Case Datastore
    description: Files and folders attached to a case
  - name: Notifications
    description: End-user notifications and delivery settings
  - name: Search
    description: Cross-case full-text search
  - name: Tags
    description: Tag catalog used across cases and alerts
  - name: Avatars
    description: User avatar upload and retrieval
  - name: Profile
    description: Current user profile, preferences and followed cases
  - name: Mail rules
    description: Mail ingestion rules and diagnostics
  - name: Access control
    description: Access-control schema, effective access and recompute jobs
  - name: Case objects
    description: Taxonomies for asset types, IoC types, evidence types, case classifications and case states
  - name: Case templates
    description: Case templates and their generation schemas
  - name: Custom attributes
    description: Custom attribute definitions attached to case objects
  - name: Report templates
    description: Report generation templates and rendering
  - name: Server admin
    description: Server-wide settings, backups and mail test
  - name: Taxonomies
    description: Read-only taxonomies (severities, TLP, statuses, resolutions, categories)
  - name: War rooms
    description: Cross-case collaboration spaces
  - name: War room chat
    description: Messages, threads, reactions and polls inside a war room
  - name: War room datastore
    description: Files attached to a war room
  - name: War room notes
    description: Notes and revisions inside a war room
  - name: War room sitreps
    description: Situation reports and their exports
  - name: War room tasks
    description: Tasks tracked in a war room
  - name: War room timelines
    description: Timelines and events tracked in a war room
  - name: Banners
    description: Server-wide announcement banners
  - name: Bug reports
    description: User-submitted bug reports
  - name: Case chat
    description: Assistant conversations scoped to a case, war room or the whole server
  - name: Case transfer
    description: Export a case to an archive and import it back, here or on another server
  - name: Dim hooks
    description: Module hooks that can be invoked on objects
  - name: Managed assets
    description: The asset inventory maintained outside of any case
  - name: Runtime config
    description: Server settings the frontend reads at boot
  - name: War room teams
    description: Sub-teams a war room's responders are organised into
  - name: Beta
    description: These are all the endpoints which are still in beta. Their signature may evolve. Any feedback is welcome!

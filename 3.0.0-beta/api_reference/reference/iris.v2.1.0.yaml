info:
  title: IRIS
  version: 2.1.0
  description: |
    ## IRIS API
    To use these API endpoint, an API key is needed and can be found in every user profile under `My settings` > `API Key`.
    API `v2.1` is the API version shipped with IRIS v3. The supported API version can be checked in `Advanced` > `Server settings` > `Server versions` on IRIS.
    The API port is the same as the one used for the web interface, so `443` by default.

    ## Changes
    ### Changes in IRIS v3 (API v2.1)
    IRIS v3 substantially expands the `/api/v2` surface without introducing a new API version. Every legacy endpoint that already had a `/api/v2` equivalent in earlier IRIS releases remains deprecated; several new subsystems (war rooms, alert clusters, cluster rules, investigation flows, custom dashboards, mail rules, notifications, access control, session auth) are now exposed under `/api/v2` and are the recommended surface for all new integrations.

    See the "Migrating to IRIS v3" and "URI Converter" pages for a full mapping from legacy endpoints to their v2.1 equivalents.

    **Added in IRIS v3 (new `/api/v2` endpoints)**
    * Authentication: `POST /api/v2/auth/login`, `POST /api/v2/auth/oidc-exchange`, `POST /api/v2/auth/mfa-setup`, `POST /api/v2/auth/mfa-verify`, `GET /api/v2/auth/whoami`, `POST /api/v2/auth/logout`, `POST /api/v2/auth/refresh-token`
    * Activities feed: `GET /api/v2/activities`, `GET /api/v2/cases/{identifier}/activities`
    * Cases lifecycle: `GET /api/v2/cases/filter`, `POST /api/v2/cases/{identifier}/close`, `POST /api/v2/cases/{identifier}/reopen`, `GET /api/v2/cases/{identifier}/access/users`, `GET /api/v2/cases/{identifier}/access/me`, `GET /api/v2/cases/{identifier}/followers`, `GET /api/v2/cases/{identifier}/source-alert-cluster`, `DELETE /api/v2/cases/{identifier}/source-alert-cluster`, `DELETE /api/v2/cases/{identifier}/alerts/{alert_id}`, `GET /api/v2/cases/{identifier}/war-rooms`
    * Cases filters: `GET/POST/PUT/DELETE /api/v2/cases-filters[/{identifier}]`
    * Alert clusters: full CRUD on `/api/v2/alert-clusters[/{identifier}]` plus `/alerts`, `/escalate`, `/merge`, `/case`, `/graph`, `/comments`, `/investigation-progress`
    * Alerts extras: `POST /api/v2/alerts/{identifier}/investigation-progress/{step_id}` (and DELETE), `GET /api/v2/alerts/{identifier}/investigation-progress`
    * Cluster rules: `GET/POST/PUT/DELETE /api/v2/cluster-rules[/{identifier}]`, `/test`, `/backfill`
    * Investigation flows: `GET/POST/PUT/DELETE /api/v2/investigation-flows[/{identifier}]`, `/steps[/{step_id}]`, `/deploy`
    * Custom dashboards: `GET/POST/PUT/DELETE /api/v2/custom-dashboards[/{dashboard_uuid}]`, `/schema`, `/presets`, `/render`
    * Dashboard aggregates: `/api/v2/dashboard/cases/list`, `/dashboard/tasks/list`, `/dashboard/activities/recent`, `/dashboard/activities/cases/major`, `/dashboard/reviews/list`, `/dashboard/kpis`
    * Dim tasks: `GET /api/v2/dim-tasks[/{task_id}]`
    * Case timelines: `GET/POST/PUT/DELETE /api/v2/cases/{case_identifier}/timelines[/{timeline_id}]`
    * Case datastore: `/api/v2/cases/{case_identifier}/datastore/{tree,files,folders,...}` (full folder + file CRUD, move, interactive upload)
    * Case objects extras: `GET /api/v2/cases/{case_identifier}/assets/{identifier}/links`, `GET /api/v2/cases/{case_identifier}/iocs/{identifier}/links`, `GET /api/v2/cases/{case_identifier}/notes` (list), `GET /api/v2/cases/{case_identifier}/notes/search`, `/notes/{identifier}/revisions[/{revision_number}]` including `restore`
    * War rooms: full subtree — `/api/v2/war-rooms[/{war_room_id}]` root, `/archive`, `/members`, `/people`, `/cases`, chat + threads + polls, datastore, notes + revisions, notes-folders, sitreps + exports (md/html/pdf), tasks, timelines + events, linked-case-timelines
    * Notifications: `/api/v2/notifications`, `/unread-count`, `/mark-read`, `/clear`, `/settings`, `/manage/notification-settings`
    * Search & tags: `GET /api/v2/search`, `GET /api/v2/tags`
    * Avatars: `GET /api/v2/users/{identifier}/avatar`, `GET /api/v2/users/mentionable`, `POST/DELETE /api/v2/me/avatar`, `POST/DELETE /api/v2/manage/users/{identifier}/avatar`
    * Profile extras: `POST /api/v2/me/api-key/renew`, `POST /api/v2/me/permissions/refresh`, `GET /api/v2/me/context`, `PUT /api/v2/me/preferences`, `GET/POST /api/v2/me/followed-cases[/{case_id}]`
    * Mail rules & ingest: `/api/v2/manage/mail/rules[/{rule_id}]`, `/ingest-log`, `/poll-now`
    * Access control: `GET /api/v2/manage/access-control/schema`, `/accessible-cases`, `POST /api/v2/manage/access-control/recompute-all`
    * Case objects taxonomies (unified): `/api/v2/manage/case-objects/{asset-types|ioc-types|case-classifications|case-states|evidence-types}[/{identifier}]` plus asset-type icon upload
    * Case templates: `/api/v2/manage/case-templates[/{identifier}]`, `/schema`
    * Custom attributes: `GET /api/v2/manage/custom-attributes[/{identifier}]`, `PUT /api/v2/manage/custom-attributes/{identifier}`
    * Customers contacts: `/api/v2/manage/customers/{identifier}/contacts[/{contact_id}]`
    * Groups extras: `/api/v2/manage/groups/{identifier}/{members,cases-access}`
    * Users extras: `/api/v2/manage/users/{identifier}/{groups,customers,cases-access,activate,deactivate,api-key/renew,mfa/reset,recompute-access,audit}`, `/api/v2/manage/users/me/preferences/{key}`
    * Modules: `/api/v2/manage/modules[/{identifier}]`, `/enable`, `/disable`, `/parameters/{param_name}`, `/export-config`, `/import-config`, `/hooks`
    * Report templates: `/api/v2/manage/report-templates[/{identifier}]`, `/file`, `/download`, `/render`, `/accessible-cases`, `/schema`
    * Server admin: `/api/v2/manage/server/authentication-settings`, `/settings`, `/backups/db`, `/mail/test-send`
    * Taxonomies (read-only): `/api/v2/manage/{severities,tlp,alert-statuses,alert-resolutions,alert-cluster-statuses,analysis-statuses,event-categories,task-statuses}`

    **Legacy endpoints still live in IRIS v3** — every deprecated `/case/*`, `/alerts/*`, `/datastore/*`, `/dim/*`, `/global/*` and `/manage/*` (non-v2) endpoint listed under "Deprecated" below remains live in the IRIS v3 backend, with the following exceptions removed in v3:

    * Removed `POST /case/summary/update` (case summary is now updated via `PUT /api/v2/cases/{case_identifier}`)
    * Removed `POST /case/timeline/advanced-filter` (superseded by `GET /case/timeline/advanced-filter` and by richer `/api/v2` filters)
    * Removed `POST /manage/access-control/recompute-effective-user-ac/{user_id}` (superseded by `POST /api/v2/manage/users/{identifier}/recompute-access` and `POST /api/v2/manage/access-control/recompute-all`)
    * Removed `GET /dim/tasks/limited-list` (superseded by `GET /api/v2/dim-tasks`)

